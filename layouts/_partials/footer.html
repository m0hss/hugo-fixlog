<footer class="site-footer">
  <div class="wrap footer-row">
    <div class="curl">
      {{ with site.Home.OutputFormats.Get "json" }}<code><b>$</b> curl -sL {{ .Permalink }}</code>{{ end }}
    </div>
    <div class="foot-links">
      <span class="foot-icons">
        {{ with site.Params.repo }}<a class="foot-icon" href="{{ . }}" aria-label="Source on GitHub" title="Source on GitHub" rel="noopener"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.52-1.33-1.28-1.69-1.28-1.69-1.04-.71.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.56-.29-5.25-1.28-5.25-5.69 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.77 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.84 1.19 3.1 0 4.42-2.7 5.4-5.27 5.68.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .5Z"/></svg></a>{{ end }}
        {{ with site.Home.OutputFormats.Get "rss" }}<a class="foot-icon" href="{{ .RelPermalink }}" aria-label="RSS feed" title="RSS feed"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 11a8 8 0 0 1 8 8M5 5a14 14 0 0 1 14 14"/><circle cx="6" cy="18" r="1.4" fill="currentColor" stroke="none"/></svg></a>{{ end }}
      </span><span class="sep">|</span>
      <span>Research notebook</span><span class="sep">|</span>
      <span>©{{ now.Year }} {{ site.Title }}</span>
    </div>
  </div>
  {{ with site.Params.footer }}<p class="wrap disclaimer">{{ . }}</p>{{ end }}
</footer>
