{{- $cur := partial "nav-current.html" . -}}
<header class="site-header">
  <div class="wrap header-row">
    <a class="logo" href="{{ "/" | relURL }}" aria-label="{{ site.Title }} home">
      <span class="logo-mark">&gt;_</span><span class="logo-name">{{ site.Title }}</span>
      {{ with site.Params.version }}<span class="logo-ver">{{ . }}</span>{{ end }}
    </a>
    <button class="search-trigger" type="button" data-palette-open aria-label="Search posts">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3M13 15h4"/></svg>
      <span>filter logs or grep...</span><kbd>⌘K</kbd>
    </button>
    <div class="header-right">
      <nav class="nav" aria-label="Main">
        {{ range site.Menus.main }}
        <a href="{{ .URL }}"{{ if eq $cur .Identifier }} aria-current="page"{{ end }}>{{ .Name }}</a>
        {{ end }}
      </nav>
      <a class="author-chip" href="{{ "/" | relURL }}"><span>{{ site.Params.author }}</span>{{ with site.Params.avatar }}<img class="avatar" src="{{ . | relURL }}" alt="" width="32" height="32">{{ end }}</a>
    </div>
  </div>
</header>
