baseURL = "https://example.org/"
languageCode = "en-us"
title = "Fixlog"
theme = "fixlog"
themesDir = "../.."
enableRobotsTXT = true
capitalizeListTitles = false

[pagination]
  pagerSize = 10

[taxonomies]
  tag = "tags"

[outputs]
  home = ["HTML", "RSS", "JSON"]   # JSON powers the ⌘K palette and the footer curl line

[params]
  description = "A personal engineering notebook: experiments, dead ends, and what I learned from both."
  author = "Your Name"
  authorRole = "Builder, breaker, note-taker"
  avatar = "images/avatar.svg"          # optional
  repo = "https://github.com/you/your-log"   # optional, footer GitHub icon
  # publicURL = "https://your.domain/"  # optional, shown in the footer curl line
  # version = "v0.1"                    # optional chip next to the logo
  # manifest = "manifest.webmanifest"   # optional PWA manifest in your static/
  # footer = "Small print under the footer"

[menus]
  [[menus.main]]
    identifier = "home"
    name = "Home"
    pageRef = "/"
    weight = 10
  [[menus.main]]
    identifier = "log"
    name = "Log"
    pageRef = "/posts"
    weight = 20
  [[menus.main]]
    identifier = "archive"
    name = "Archive"
    pageRef = "/archive"
    weight = 30
  [[menus.main]]
    identifier = "status"
    name = "Status"
    pageRef = "/status"
    weight = 40

[markup.tableOfContents]
  startLevel = 2
  endLevel = 2

[markup.highlight]
  noClasses = false
